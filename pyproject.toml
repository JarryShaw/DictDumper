[build-system]
requires = [
    "setuptools>=61.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "dictdumper"
dynamic = [ "version", "readme" ]
authors = [
    { name="Jarry Shaw", email="jarryshaw@icloud.com" },
]
maintainers = [
    { name="Jarry Shaw" },
]
license = { text="BSD 3-Clause License" }
requires-python = ">=3.8"
description = "DictDumper: comprehensive network packet analysis library"
keywords = [ "formatting", "dumper", "stream" ]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Environment :: MacOS X',
    'Environment :: Win32 (MS Windows)',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Natural Language :: English',
    'Operating System :: MacOS',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: Unix',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.8',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Programming Language :: Python :: Implementation',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Python :: Implementation :: PyPy',
    'Topic :: System :: Networking',
    'Topic :: Utilities',
]
dependencies = []

[project.urls]
homepage = "https://jarryshaw.github.io/DictDumper/"
documentation = "https://jarryshaw.github.io/DictDumper/"
repository = "https://github.com/JarryShaw/DictDumper"
changelog = "https://github.com/JarryShaw/DictDumper/releases"

[project.optional-dependencies]
docs = [
    "Sphinx>=6.1.3",
]

# setuptools specific

[tool.setuptools]
zip-safe = false  # We use __file__ in dictdumper/__init__.py, therefore the package isn't zip safe

[tool.setuptools.packages.find]
include = [
    "dictdumper*",
]
exclude = [
    "test*",
    "docs*",
    "sample*",
]

[tool.setuptools.dynamic]
version = { attr="dictdumper.__version__" }
