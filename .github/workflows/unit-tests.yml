name: Unit Tests

# Nothing ran the test suite in CI before this -- a pull request could break
# dictdumper/ and nothing would say so until a release. This workflow is the
# fix: it runs tests/test.py on every push and pull request to main, across
# the Python versions requires-python actually claims (3.8+ in pyproject.toml)
# plus PyPy, matching the install matrix create-release.yml already publishes
# wheels for.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: unit-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "pypy3.9"
          - "pypy3.10"
        # setup-python's manifest has no 3.8/3.9 build for ubuntu-latest
        # (26.04) -- pin those two to the last Ubuntu image that still has
        # one, rather than drop the floor requires-python actually claims.
        include:
          - python-version: "3.8"
            os: ubuntu-24.04
          - python-version: "3.9"
            os: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Run tests
        run: python tests/test.py

  lint:
    name: PEP 8 (pycodestyle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install pycodestyle

      - name: pycodestyle
        run: python -m pycodestyle --max-line-length=120 dictdumper/

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[docs]"

      - name: Build
        run: python -m sphinx -b html -W doc/source /tmp/dictdumper-docs-build
