on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  #release:
  #  types: ['published']

name: Create Release

jobs:
  version_check:
    name: Check Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install and Setup
        run: |
          python -m pip install -U pip setuptools wheel packaging

      - name: Get Version
        id: get_version
        run: |
          set -x

          python -m pip install -e .

          echo "DICTDUMPER_VERSION=$(python -c 'import dictdumper; print(dictdumper.__version__)')" >> $GITHUB_OUTPUT
          echo "DICTDUMPER_PRERELEASE=$(python -c 'import dictdumper, packaging.version; print(str(packaging.version.parse(dictdumper.__version__).is_prerelease).lower())')" >> $GITHUB_OUTPUT
          echo "DICTDUMPER_CONDA_LABEL=$(python -c 'import dictdumper, packaging.version; print("dev" if packaging.version.parse(dictdumper.__version__).is_prerelease else "main")')" >> $GITHUB_OUTPUT

      - uses: mukunku/tag-exists-action@v1.2.0
        id: check_tag
        with:
          tag: "v${{ steps.get_version.outputs.DICTDUMPER_VERSION }}"

    outputs:
      DICTDUMPER_VERSION: ${{ steps.get_version.outputs.DICTDUMPER_VERSION }}
      DICTDUMPER_PRERELEASE: ${{ steps.get_version.outputs.DICTDUMPER_PRERELEASE }}
      DICTDUMPER_TAG_EXISTS: ${{ steps.check_tag.outputs.exists }}
      DICTDUMPER_CONDA_LABEL: ${{ steps.get_version.outputs.DICTDUMPER_CONDA_LABEL }}

  github:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [ version_check ]
    if: ${{ startsWith(github.ref_name, 'v') || needs.version_check.outputs.DICTDUMPER_TAG_EXISTS == 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # ref: v${{ needs.version_check.outputs.DICTDUMPER_VERSION }}
          fetch-depth: 0

      - name: Changelog
        uses: Bullrich/generate-release-changelog@2.0.2
        id: changelog
        env:
          REPO: ${{ github.repository }}

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1.14.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          allowUpdates: true
          # artifacts: |
          #   dist/*
          # body: ${{ env.DICTDUMPER_CHANGELOG }}
          body: |
            ${{ steps.changelog.outputs.changelog }}
          # generateReleaseNotes: true
          # makeLatest: true
          name: DictDumper v${{ needs.version_check.outputs.DICTDUMPER_VERSION }}
          prerelease: ${{ needs.version_check.outputs.DICTDUMPER_PRERELEASE }}
          tag: "v${{ needs.version_check.outputs.DICTDUMPER_VERSION }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

  tag:
    name: Conda Tag
    runs-on: ubuntu-latest
    needs: [ version_check ]
    if: ${{ startsWith(github.ref_name, 'v') || needs.version_check.outputs.DICTDUMPER_TAG_EXISTS == 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DICTDUMPER }}
          # ref: v${{ needs.version_check.outputs.DICTDUMPER_VERSION }}
          fetch-depth: 0

      - name: Reset Build Number
        run: |
          set -x

          printf 0 > conda/build

      - name: Commit Changes
        run: |
          set -x

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add conda/build
          git commit -m"Reset conda build number" || true

      - name: Push Changes
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.DICTDUMPER }}

      - name: Create Tag
        run: |
          set -x

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git tag -d v${{ needs.version_check.outputs.DICTDUMPER_VERSION }} || true
          # -f: a retry of the same version (e.g. after fixing something else
          # in this workflow) finds this tag already pushed by the previous
          # attempt, and would otherwise fail outright with "tag already
          # exists" before ever reaching the Push Tag step.
          git tag -f "conda-${{ needs.version_check.outputs.DICTDUMPER_VERSION }}+0" -m"Conda Build"

      - name: Push Tag
        uses: ad-m/github-push-action@v1.3.0
        with:
          github_token: ${{ secrets.DICTDUMPER }}
          atomic: false
          tags: true
          # force: a retried run recreates conda-<version>+0 as a new
          # annotated tag object (different SHA, same ref name and commit)
          # even when nothing else changed, which a plain push rejects.
          force: true

  pypi:
    name: PyPI distribution for Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    needs: [ github, version_check ]
    if: ${{ startsWith(github.ref_name, 'v') || needs.version_check.outputs.DICTDUMPER_TAG_EXISTS == 'false' }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "pypy3.8"
          - "pypy3.9"
          - "pypy3.10"
        # setup-python's manifest has no 3.9 build for ubuntu-latest (26.04) --
        # pin it to the last Ubuntu image that still has one, same fix as
        # unit-tests.yml.
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
    permissions:
      contents: write
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version_check.outputs.DICTDUMPER_VERSION }}
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and Setup
        run: |
          set -x

          python -m pip install -U pip setuptools wheel
          python -m pip install -U build

      - name: Build Package
        env:
          DICTDUMPER_VERSION: ${{ needs.version_check.outputs.DICTDUMPER_VERSION }}
        run: |
          python -m build

          # rename wheel's python tag
          python util/wheel_rename.py dist/*.whl

      - name: No Source Distribution for Python ${{ matrix.python-version }}
        if: ${{ matrix.python-version != '3.12' }}
        run: |
          rm dist/*.tar.gz

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false

      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false

      - name: Upload package to GitHub Release
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          artifacts: |
            dist/*
          tag: "v${{ needs.version_check.outputs.DICTDUMPER_VERSION }}"
          token: "${{ secrets.GITHUB_TOKEN }}"

  conda:
    name: Conda deployment of package for platform ${{ matrix.os }} with Python ${{ matrix.python-version }}
    # matrix.runner overrides this for the one combination setup-python can't
    # serve directly -- see the include entry below.
    runs-on: ${{ matrix.runner || matrix.os }}
    needs: [ tag, github, version_check ]
    if: ${{ startsWith(github.ref_name, 'v') || needs.version_check.outputs.DICTDUMPER_TAG_EXISTS == 'false' }}
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          # - windows-latest  # skip for now
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        # setup-python's manifest has no 3.9 build for ubuntu-latest (26.04).
        # matrix.os stays 'ubuntu-latest' here on purpose -- the platform_*
        # conditionals below key off that exact string -- only the runner
        # this job actually executes on moves to ubuntu-24.04.
        include:
          - os: ubuntu-latest
            python-version: "3.9"
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conda-${{ needs.version_check.outputs.DICTDUMPER_VERSION }}+0
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install and Setup
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          set -x

          python -m pip install -U pip setuptools wheel
          python -m pip install -e .

      - name: Install and Setup (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -e .

      - name: Conda environment creation and activation
        uses: conda-incubator/setup-miniconda@v3
        env:
          DICTDUMPER_VERSION: ${{ needs.version_check.outputs.DICTDUMPER_VERSION }}
          DICTDUMPER_BUILD: "0"
        with:
          python-version: ${{ matrix.python-version }}
          environment-file: conda/conda-build.yaml    # Path to the build conda environment
          auto-update-conda: false
          auto-activate-base: false
          show-channel-urls: true

      # conda-build.yaml installs conda-build into the "test" env, but `conda
      # build` is a subcommand of whichever conda executable the next action's
      # run step actually invokes -- and uibcdf/action-build-and-upload-conda-
      # packages runs its build command in a login shell (bash -l), which
      # doesn't source the .bashrc setup-miniconda edits to activate "test".
      # The result: `conda build` resolves against base, which never got the
      # plugin, and fails with "invalid choice: 'build'". Installing it into
      # base directly sidesteps the activation question entirely.
      - name: Ensure conda-build is importable from base conda
        run: conda install -n base -y -c conda-forge conda-build anaconda-client

      - name: Build and upload the conda packages (macOS)
        uses: uibcdf/action-build-and-upload-conda-packages@v1.2.0
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          DICTDUMPER_VERSION: ${{ needs.version_check.outputs.DICTDUMPER_VERSION }}
          DICTDUMPER_BUILD: "0"
        with:
          meta_yaml_dir: conda/dictdumper
          python-version: ${{ matrix.python-version }} # Values previously defined in `matrix`
          platform_osx-64: true
          user: jarryshaw
          label: ${{ needs.version_check.outputs.DICTDUMPER_CONDA_LABEL }}
          token: ${{ secrets.ANACONDA_TOKEN }} # Replace with the right name of your secret

      - name: Build and upload the conda packages (Ubuntu)
        uses: uibcdf/action-build-and-upload-conda-packages@v1.2.0
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          DICTDUMPER_VERSION: ${{ needs.version_check.outputs.DICTDUMPER_VERSION }}
          DICTDUMPER_BUILD: "0"
        with:
          meta_yaml_dir: conda/dictdumper
          python-version: ${{ matrix.python-version }} # Values previously defined in `matrix`
          platform_linux-64: true
          user: jarryshaw
          label: ${{ needs.version_check.outputs.DICTDUMPER_CONDA_LABEL }}
          token: ${{ secrets.ANACONDA_TOKEN }} # Replace with the right name of your secret

      - name: Build and upload the conda packages (Windows)
        uses: uibcdf/action-build-and-upload-conda-packages@v1.2.0
        if: ${{ matrix.os == 'windows-latest' }}
        env:
          DICTDUMPER_VERSION: ${{ needs.version_check.outputs.DICTDUMPER_VERSION }}
          DICTDUMPER_BUILD: "0"
        with:
          meta_yaml_dir: conda/dictdumper
          python-version: ${{ matrix.python-version }} # Values previously defined in `matrix`
          platform_win-64: true
          user: jarryshaw
          label: ${{ needs.version_check.outputs.DICTDUMPER_CONDA_LABEL }}
          token: ${{ secrets.ANACONDA_TOKEN }} # Replace with the right name of your secret

      - name: Upload package to GitHub Release
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          artifacts: |
            /tmp/compilation-*/**/*.tar.bz2
          tag: "v${{ needs.version_check.outputs.DICTDUMPER_VERSION }}"
          token: "${{ secrets.GITHUB_TOKEN }}"
